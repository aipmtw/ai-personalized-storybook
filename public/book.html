<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff6f61">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>小美的恐龍冒險</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="book-container" id="bookContainer">
    <div class="pages-wrapper" id="pagesWrapper">
      <!-- Pages are rendered by JS -->
    </div>

    <!-- Touch hint arrows -->
    <div class="touch-hint left" id="hintLeft">&#8249;</div>
    <div class="touch-hint right" id="hintRight">&#8250;</div>
  </div>

  <!-- Bottom toolbar -->
  <div class="toolbar">
    <a href="/" class="toolbar-btn" title="首頁">&#x1F3E0;</a>
    <div class="progress-dots" id="progressDots"></div>
    <button class="toolbar-btn" id="fullscreenBtn" title="全螢幕" onclick="toggleFullscreen()">&#x26F6;</button>
  </div>

  <!-- Install banner -->
  <div class="install-banner hidden" id="installBanner">
    <span>加入主畫面</span>
    <button onclick="installApp()">安裝</button>
    <button class="dismiss" onclick="dismissInstall()">&times;</button>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
