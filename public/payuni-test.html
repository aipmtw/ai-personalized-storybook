<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayUni 測試 — 馬克路思</title>
<style>
  body { font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; max-width: 560px; margin: 40px auto; padding: 20px; color: #222; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #777; font-size: 14px; margin-bottom: 24px; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; color: #555; }
  input, select { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
  button { background: #0066cc; color: #fff; border: 0; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 16px; width: 100%; }
  button:hover { background: #0052a3; }
  .note { background: #fff8dc; border-left: 3px solid #e0b000; padding: 12px 16px; font-size: 13px; margin-top: 24px; border-radius: 4px; }
  .note code { background: #eee; padding: 1px 4px; border-radius: 3px; }
  a { color: #0066cc; }
</style>
</head>
<body>
  <h1>PayUni 測試頁</h1>
  <div class="sub">PAYUNi 統一金流 — 沙盒環境測試</div>

  <form method="POST" action="/api/payuni/checkout">
    <label for="amount">金額 (NT$)</label>
    <input id="amount" name="amount" type="number" min="1" value="1">

    <label for="itemName">商品名稱</label>
    <input id="itemName" name="itemName" type="text" maxlength="100" value="Storybook Test — 繪本測試">

    <label for="email">Email (optional)</label>
    <input id="email" name="email" type="email" maxlength="80" placeholder="user@example.com">

    <button type="submit">前往 PayUni 付款</button>
  </form>

  <div class="note">
    <b>設定提醒</b><br>
    需在 Vercel 環境變數設定：<br>
    <code>PAYUNI_MODE</code> (<code>test</code> 或 <code>prod</code>)<br>
    <code>PAYUNI_MER_ID</code><br>
    <code>PAYUNI_HASH_KEY</code> (32-char)<br>
    <code>PAYUNI_HASH_IV</code> (16-char)<br><br>
    詳見 <a href="/biz-model/payuni-integration-notes.md">biz-model/payuni-integration-notes.md</a>
  </div>
</body>
</html>
