<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff6f61">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>dino-school</title>
  <link rel="manifest" href="/dino-school/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dino-school/css/style.css">
</head>
<body>
  <div class="top-controls">
    <div class="lang-toggle" id="langToggle">
      <button class="active" data-lang="both">中＋EN</button>
      <button data-lang="zh">中文</button>
      <button data-lang="en">English</button>
    </div>
    <button class="autoplay-toggle" id="autoplayBtn">&#9654;&#9654; 自動播放</button>
  </div>
  <div class="page-container" id="pageContainer"></div>
  <div class="audio-bar hidden" id="audioBar">
    <button class="ab-btn" id="abPlayPause">&#9654;</button>
    <span class="ab-time" id="abCurrent">0:00</span>
    <input type="range" class="ab-slider" id="abSlider" min="0" max="100" value="0" step="0.1">
    <span class="ab-time" id="abTotal">0:00</span>
    <button class="ab-btn ab-close" id="abClose">&#x2715;</button>
  </div>
  <div class="toolbar">
    <a href="/" class="toolbar-btn" title="首頁">&#x1F3E0;</a>
    <button class="toolbar-btn audio-btn" id="audioBtn" title="播放朗讀">&#x1F50A;</button>
    <span class="toolbar-page" id="pageIndicator">1 / 12</span>
    <button class="toolbar-btn" id="fullscreenBtn" title="全螢幕">&#x26F6;</button>
  </div>
  <script src="/dino-school/js/data.js?v=2"></script>
  <script src="/shared/reader.js?v=3"></script>
</body>
</html>
