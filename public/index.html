<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 個人化語言繪本 | MarkLuce.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Noto Sans TC',sans-serif;background:#fafaf8;color:#212529;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
    .header{text-align:center;margin-bottom:2.5rem}
    .header h1{font-size:1.8rem;font-weight:900;color:#212529}
    .header p{font-size:1rem;color:#6c757d;margin-top:.4rem}
    .books{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;max-width:700px;width:100%}
    .book-card{border-radius:20px;padding:2rem;text-align:center;color:#fff;text-decoration:none;transition:transform .2s,box-shadow .2s;display:block}
    .book-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,0.15)}
    .book-card .emoji{font-size:4rem;margin-bottom:1rem}
    .book-card h2{font-size:1.4rem;font-weight:900;margin-bottom:.3rem}
    .book-card .subtitle{font-size:1rem;opacity:.85;margin-bottom:.5rem}
    .book-card .age{font-size:.82rem;opacity:.7;background:rgba(255,255,255,.2);display:inline-block;padding:.2rem .8rem;border-radius:12px}
    .card-mei{background:linear-gradient(135deg,#ff6f61,#ff8a65)}
    .card-max{background:linear-gradient(135deg,#1a237e,#311b92)}
    .footer{margin-top:2.5rem;text-align:center;font-size:.9rem;color:#adb5bd}
    .footer a{color:#6c757d;text-decoration:underline}
  </style>
</head>
<body>
  <div class="header">
    <h1>AI 個人化語言繪本</h1>
    <p>每本書都是為孩子量身打造的雙語故事</p>
  </div>
  <div class="books">
    <a class="book-card card-mei" href="/mei/">
      <div class="emoji">🦕</div>
      <h2>小美的恐龍冒險</h2>
      <div class="subtitle">Mei's Dinosaur Adventure</div>
      <div class="age">4-6 歲</div>
    </a>
    <a class="book-card card-max" href="/max/">
      <div class="emoji">🚀</div>
      <h2>Max 的太空探險</h2>
      <div class="subtitle">Max's Space Adventure</div>
      <div class="age">10-12 歲</div>
    </a>
  </div>
  <div class="footer">
    由 <a href="https://markluce.ai/">MarkLuce.ai</a> 出品 · Powered by Claude Opus 4.6
  </div>
</body>
</html>
