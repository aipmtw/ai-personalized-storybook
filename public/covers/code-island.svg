<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#00897b"/><stop offset="100%" style="stop-color:#4db6ac"/></linearGradient></defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Water -->
  <path d="M0 250 Q50 240 100 250 Q150 260 200 250 Q250 240 300 250 Q350 260 400 250 L400 300 L0 300 Z" fill="#00695c" opacity="0.3"/>
  <!-- Island -->
  <ellipse cx="200" cy="230" rx="130" ry="40" fill="#66bb6a"/>
  <!-- Palm tree -->
  <rect x="280" y="150" width="8" height="80" rx="3" fill="#8d6e63"/>
  <path d="M284 150 Q260 130 240 140" stroke="#4caf50" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M284 150 Q310 125 325 140" stroke="#4caf50" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M284 155 Q270 140 255 150" stroke="#388e3c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Terminal/screen -->
  <rect x="120" y="140" width="100" height="70" rx="6" fill="#263238"/>
  <rect x="126" y="146" width="88" height="52" rx="3" fill="#37474f"/>
  <!-- Code lines -->
  <rect x="132" y="154" width="40" height="4" rx="2" fill="#4fc3f7" opacity="0.8"/>
  <rect x="140" y="164" width="55" height="4" rx="2" fill="#81c784" opacity="0.7"/>
  <rect x="140" y="174" width="35" height="4" rx="2" fill="#ffd54f" opacity="0.6"/>
  <rect x="132" y="184" width="45" height="4" rx="2" fill="#ef5350" opacity="0.5"/>
  <!-- Bridge (broken) -->
  <rect x="60" y="210" width="50" height="8" rx="2" fill="#8d6e63"/>
  <rect x="130" y="210" width="30" height="8" rx="2" fill="#8d6e63" opacity="0.4" stroke="#ef5350" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Logic blocks -->
  <rect x="80" y="170" width="20" height="20" rx="3" fill="#ffd54f"/><text x="85" y="184" font-size="10" fill="#333" font-weight="bold">if</text>
  <rect x="50" y="180" width="20" height="20" rx="3" fill="#4fc3f7"/><text x="52" y="194" font-size="8" fill="white" font-weight="bold">for</text>
  <!-- Boy -->
  <circle cx="330" cy="190" r="14" fill="#ffe0b2"/>
  <path d="M316 188 Q316 172 330 172 Q344 172 344 188" fill="#333"/>
  <circle cx="325" cy="187" r="2" fill="#333"/><circle cx="335" cy="187" r="2" fill="#333"/>
