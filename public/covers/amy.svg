  <circle cx="94" cy="167" r="2.5" fill="#333"/>
  <circle cx="106" cy="167" r="2.5" fill="#333"/>
  <path d="M95 176 Q100 181 105 176" stroke="#e91e63" stroke-width="2" fill="none"/>
  <rect x="92" y="188" width="16" height="35" rx="5" fill="#7b1fa2"/>
  <!-- Wand -->
