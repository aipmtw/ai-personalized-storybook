      <stop offset="0%" style="stop-color:#e91e63"/>
      <stop offset="100%" style="stop-color:#f06292"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Magic sparkles -->
  <circle cx="80" cy="60" r="4" fill="#ffd54f" opacity="0.8"/>
  <circle cx="320" cy="80" r="3" fill="#ffd54f" opacity="0.7"/>
  <circle cx="150" cy="40" r="2" fill="white" opacity="0.6"/>
  <circle cx="280" cy="50" r="5" fill="#ffd54f" opacity="0.5"/>
  <!-- Book -->
  <rect x="140" y="130" width="120" height="90" rx="5" fill="#7b1fa2" transform="rotate(-5 200 175)"/>
  <rect x="145" y="135" width="110" height="80" rx="3" fill="#9c27b0" transform="rotate(-5 200 175)"/>
  <!-- Pages -->
  <line x1="200" y1="135" x2="200" y2="215" stroke="white" stroke-width="1" opacity="0.3" transform="rotate(-5 200 175)"/>
  <!-- Stars from book -->
  <path d="M180 120 L183 110 L186 120 L176 114 L190 114 Z" fill="#ffd54f"/>
  <path d="M220 105 L222 98 L224 105 L217 101 L227 101 Z" fill="#ffd54f"/>
