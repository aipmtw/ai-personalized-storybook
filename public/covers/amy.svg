  <rect x="260" y="140" width="16" height="40" rx="8" fill="#bdbdbd"/>
  <circle cx="268" cy="135" r="14" fill="#9e9e9e"/>
  <path d="M268 125 Q268 120 268 125" stroke="#757575" stroke-width="8" fill="none"/>
  <!-- Girl with wand -->
