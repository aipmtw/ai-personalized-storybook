<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6f61"/>
      <stop offset="100%" style="stop-color:#ff8a65"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Ground -->
  <ellipse cx="200" cy="280" rx="180" ry="30" fill="#e65100" opacity="0.2"/>
  <!-- Dinosaur body -->
  <ellipse cx="200" cy="180" rx="60" ry="50" fill="#4caf50"/>
  <!-- Neck -->
  <path d="M180 150 Q170 100 190 70" stroke="#4caf50" stroke-width="25" fill="none" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="195" cy="65" r="22" fill="#66bb6a"/>
  <circle cx="188" cy="58" r="4" fill="white"/>
  <circle cx="189" cy="59" r="2" fill="#333"/>
  <circle cx="203" cy="58" r="4" fill="white"/>
  <circle cx="204" cy="59" r="2" fill="#333"/>
  <!-- Smile -->
  <path d="M188 72 Q196 80 204 72" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Legs -->
  <rect x="165" y="215" width="18" height="35" rx="8" fill="#388e3c"/>
  <rect x="215" y="215" width="18" height="35" rx="8" fill="#388e3c"/>
  <!-- Tail -->
  <path d="M260 185 Q300 170 320 200" stroke="#4caf50" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Spikes -->
  <circle cx="185" cy="135" r="6" fill="#a5d6a7"/>
  <circle cx="195" cy="125" r="5" fill="#a5d6a7"/>
  <circle cx="207" cy="135" r="6" fill="#a5d6a7"/>
  <!-- Girl -->
  <circle cx="110" cy="195" r="15" fill="#ffe0b2"/>
  <path d="M95 195 Q95 175 110 175 Q125 175 125 195" fill="#5d4037"/>
  <circle cx="105" cy="193" r="2" fill="#333"/>
  <circle cx="115" cy="193" r="2" fill="#333"/>
  <path d="M106 200 Q110 204 114 200" stroke="#e91e63" stroke-width="1.5" fill="none"/>
  <rect x="102" y="210" width="16" height="30" rx="5" fill="#e91e63"/>
  <!-- Stars -->
  <circle cx="50" cy="50" r="3" fill="white" opacity="0.6"/>
  <circle cx="340" cy="40" r="2" fill="white" opacity="0.5"/>
  <circle cx="300" cy="80" r="3" fill="white" opacity="0.4"/>
</svg>
