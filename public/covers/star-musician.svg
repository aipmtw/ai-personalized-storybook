<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#7b1fa2"/><stop offset="100%" style="stop-color:#ba68c8"/></linearGradient></defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Stars/notes -->
  <path d="M60 50 L63 40 L66 50 L56 44 L70 44 Z" fill="#ffd54f" opacity="0.7"/>
