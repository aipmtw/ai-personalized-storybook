  <g transform="translate(310,110)" fill="#ffd54f" opacity="0.5"><ellipse cx="0" cy="0" rx="5" ry="4"/><line x1="5" y1="0" x2="5" y2="-20" stroke="#ffd54f" stroke-width="2"/></g>
