  <path d="M230 140 Q250 120 250 180" stroke="#ffd54f" stroke-width="3" fill="none"/>
  <line x1="232" y1="145" x2="248" y2="145" stroke="#ffd54f" stroke-width="1.5" opacity="0.8"/>
  <line x1="234" y1="155" x2="250" y2="155" stroke="#ffd54f" stroke-width="1.5" opacity="0.7"/>
  <line x1="235" y1="165" x2="250" y2="165" stroke="#ffd54f" stroke-width="1.5" opacity="0.6"/>
  <line x1="234" y1="175" x2="249" y2="175" stroke="#ffd54f" stroke-width="1.5" opacity="0.5"/>
