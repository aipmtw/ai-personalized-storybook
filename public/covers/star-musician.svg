  <circle cx="193" cy="152" r="2.5" fill="#333"/><circle cx="207" cy="152" r="2.5" fill="#333"/>
  <path d="M195 162 Q200 167 205 162" stroke="#e91e63" stroke-width="1.5" fill="none"/>
  <rect x="192" y="173" width="16" height="35" rx="5" fill="#e1bee7"/>
