<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#c62828"/><stop offset="100%" style="stop-color:#ef5350"/></linearGradient></defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Bookshelves -->
  <rect x="220" y="80" width="160" height="180" rx="5" fill="#5d4037"/>
  <rect x="225" y="85" width="150" height="40" fill="#4e342e"/>
  <rect x="225" y="130" width="150" height="40" fill="#4e342e"/>
  <rect x="225" y="175" width="150" height="40" fill="#4e342e"/>
  <!-- Books on shelves -->
  <rect x="230" y="90" width="12" height="32" rx="1" fill="#42a5f5"/><rect x="245" y="95" width="10" height="27" rx="1" fill="#66bb6a"/><rect x="258" y="88" width="14" height="34" rx="1" fill="#ffa726"/><rect x="275" y="92" width="10" height="30" rx="1" fill="#ab47bc"/><rect x="290" y="90" width="12" height="32" rx="1" fill="#ef5350"/>
  <rect x="230" y="135" width="14" height="32" rx="1" fill="#ffd54f"/><rect x="248" y="138" width="10" height="29" rx="1" fill="#4fc3f7"/><rect x="262" y="133" width="12" height="34" rx="1" fill="#e91e63"/><rect x="278" y="137" width="10" height="30" rx="1" fill="#8bc34a"/>
  <rect x="230" y="180" width="10" height="32" rx="1" fill="#ce93d8"/><rect x="244" y="183" width="14" height="29" rx="1" fill="#ff8a65"/><rect x="262" y="178" width="10" height="34" rx="1" fill="#26a69a"/>
  <!-- Dragon -->
  <ellipse cx="130" cy="190" rx="50" ry="35" fill="#388e3c"/>
  <path d="M110 170 Q100 130 120 100" stroke="#388e3c" stroke-width="20" fill="none" stroke-linecap="round"/>
  <circle cx="125" cy="95" r="22" fill="#4caf50"/>
  <!-- Eyes -->
  <circle cx="117" cy="88" r="5" fill="#ffd54f"/><circle cx="118" cy="89" r="2.5" fill="#333"/>
  <circle cx="133" cy="88" r="5" fill="#ffd54f"/><circle cx="134" cy="89" r="2.5" fill="#333"/>
  <!-- Nostrils -->
  <circle cx="120" cy="100" r="2" fill="#2e7d32"/><circle cx="130" cy="100" r="2" fill="#2e7d32"/>
  <!-- Small horns -->
  <path d="M112 78 L108 65 L116 75" fill="#ffa726"/>
  <path d="M138 78 L142 65 L134 75" fill="#ffa726"/>
  <!-- Wings -->
  <path d="M85 170 Q50 140 60 110 Q70 130 80 120 Q75 150 85 170" fill="#66bb6a" opacity="0.7"/>
  <!-- Tail -->
  <path d="M180 195 Q210 180 230 200 Q225 190 240 195" stroke="#388e3c" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Dragon reading a book -->
  <rect x="140" y="140" width="30" height="22" rx="2" fill="#fff9c4" transform="rotate(-10 155 151)"/>
  <line x1="155" y1="140" x2="155" y2="162" stroke="#e0e0e0" stroke-width="0.5" transform="rotate(-10 155 151)"/>
  <!-- Sparkles from book -->
  <circle cx="160" cy="125" r="3" fill="#ffd54f" opacity="0.6"/>
  <circle cx="175" cy="118" r="2" fill="#ffd54f" opacity="0.4"/>
  <circle cx="148" cy="115" r="2" fill="#ffd54f" opacity="0.5"/>
</svg>
